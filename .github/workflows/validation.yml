name: Validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: gradle:8.14.3-jdk17
    defaults:
      run:
        working-directory: BookAppBack
    steps:
      - uses: actions/checkout@v6
      - run: gradle test --no-daemon

  ai:
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      REVIEWED_TEST_DATABASE_URL: postgresql+asyncpg://postgres:fixture@localhost:5432/postgres
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BookAppAI
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BookAppAI/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: DATABASE_URL="$REVIEWED_TEST_DATABASE_URL" python -m alembic upgrade head
      - run: python -m pytest -q

  frontend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BookAppFront
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: BookAppFront/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.WEB_API_URL || 'https://152.67.222.15' }}
      - name: Record release revision
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node -e 'require("node:fs").writeFileSync("dist/release.json", JSON.stringify({commit:process.env.GITHUB_SHA, run:process.env.GITHUB_RUN_ID}) + "\n")'
      - name: Keep the verified web build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: BookAppFront/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: |
          for script in deploy/*-server-release.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy/tests -v

  publish-server:
    name: Publish production server images
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.OCI_AUTO_DEPLOY_ENABLED == 'true'))
    needs: [backend, ai, frontend, deployment]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      server_revision: ${{ steps.plan.outputs.server_revision }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production-server
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io/corinbeom/read-on-me
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select the required server release
        id: plan
        env:
          WEB_API_URL: ${{ vars.WEB_API_URL || 'https://152.67.222.15' }}
        run: bash deploy/plan-server-release.sh
      - uses: docker/setup-buildx-action@v3
        if: steps.plan.outputs.mode != 'reuse'
      - uses: docker/build-push-action@v6
        if: steps.plan.outputs.mode == 'build'
        id: spring
        with:
          context: BookAppBack
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/spring:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        if: steps.plan.outputs.mode == 'build' || steps.plan.outputs.mode == 'ai'
        id: ai
        with:
          context: BookAppAI
          platforms: linux/amd64
          build-args: EMBEDDING_PROVIDER=gemini
          push: true
          tags: ${{ env.REGISTRY }}/ai:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish the matched image pair
        if: steps.plan.outputs.mode != 'reuse'
        env:
          GH_TOKEN: ${{ github.token }}
          SPRING_DIGEST: ${{ steps.spring.outputs.digest || steps.plan.outputs.spring_digest }}
          AI_DIGEST: ${{ steps.ai.outputs.digest || steps.plan.outputs.ai_digest }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'A newer main revision exists; keeping the current server release.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash deploy/publish-server-release.sh

  deploy-web:
    name: Deploy production web
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.backend.result == 'success' && needs.ai.result == 'success'
      && needs.frontend.result == 'success' && needs.deployment.result == 'success'
      && (vars.OCI_AUTO_DEPLOY_ENABLED != 'true' || needs.publish-server.result == 'success')
    needs: [backend, ai, frontend, deployment, publish-server]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: production-web
      cancel-in-progress: false
    environment:
      name: production
      url: https://read-on-me-beta.pages.dev
    defaults:
      run:
        working-directory: BookAppFront
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check deploy credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-${{ github.sha }}
          path: BookAppFront/dist
      - name: Verify downloaded build
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.WEB_API_URL || 'https://152.67.222.15' }}
        run: |
          node scripts/verify-web-export.cjs
          node -e 'if (require("./dist/release.json").commit !== process.env.GITHUB_SHA) process.exit(1)'
      - name: Wait for the required OCI release
        if: vars.OCI_AUTO_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_SERVER: ${{ needs.publish-server.outputs.server_revision }}
          WEB_API_URL: ${{ vars.WEB_API_URL || 'https://152.67.222.15' }}
        run: |
          [[ "$REQUIRED_SERVER" =~ ^[0-9a-f]{40}$ ]]
          for attempt in $(seq 1 72); do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [ "$latest" != "$GITHUB_SHA" ]; then
              exit 0
            fi
            if curl --fail --silent --max-time 5 "${WEB_API_URL%/}/server-release.json?run=$GITHUB_RUN_ID&attempt=$GITHUB_RUN_ATTEMPT&poll=$attempt" |
              jq -e --arg sha "$REQUIRED_SERVER" '.commit == $sha' >/dev/null; then
              jq --arg sha "$REQUIRED_SERVER" '. + {serverCommit: $sha}' dist/release.json > dist/release.tmp
              mv dist/release.tmp dist/release.json
              exit 0
            fi
            sleep 10
          done
          echo "::error::OCI did not confirm required server revision $REQUIRED_SERVER"
          exit 1
      - name: Check current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision exists; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy the verified main build
        if: steps.revision.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.162.0 pages deploy dist --project-name read-on-me-beta --branch main --commit-hash "$GITHUB_SHA"
      - name: Verify published revision
        if: steps.revision.outputs.current == 'true'
        run: |
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 10 "https://read-on-me-beta.pages.dev/release.json?run=$GITHUB_RUN_ID" -o /tmp/published-release.json &&
              node -e 'const expected = require("./dist/release.json"), live = require("/tmp/published-release.json"); if (live.commit !== process.env.GITHUB_SHA || live.serverCommit !== expected.serverCommit) process.exit(1)'; then
              echo "Published main revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              echo 'https://read-on-me-beta.pages.dev' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 3
          done
          echo '::error::The published revision does not match this main build'
          exit 1
