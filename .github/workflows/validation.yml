name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    container: gradle:8.14.3-jdk17
    defaults:
      run:
        working-directory: BookAppBack
    steps:
      - uses: actions/checkout@v6
      - run: gradle test --no-daemon

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BookAppAI
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: BookAppAI/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BookAppFront
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: BookAppFront/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
