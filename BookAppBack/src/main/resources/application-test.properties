## Test profile — H2 in-memory DB, no Flyway, no real secrets required

# H2 in-memory (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate creates schema from entities, drops on exit
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=false

# Flyway off — schema managed by ddl-auto above
spring.flyway.enabled=false

# Kakao API (dummy)
kakao.api.key=test-kakao-key
kakao.api.url=https://dapi.kakao.com/v3/search/book

# JWT / internal token (test values, not validated — ProdSecretValidator is @Profile("prod"))
jwt.secret=test-jwt-secret-that-is-at-least-32-characters-long
jwt.expiration=3600000
internal.api.token=test-internal-token-placeholder

# CORS / URL (test values)
cors.allowed.origins=http://localhost:8081
ai.base-url=http://localhost:8000

# Library API (dummy)
library.api.key=test-library-key

# Redis — uses default localhost; no connection until first access (lazy)
spring.data.redis.url=redis://localhost:6379
